<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>deepin | security</title>
<meta name="description" content="deepin security: güvenlik kayıtlarını kanıtlı incelemelere dönüştürür. Kurgusal kurumla hazırlanmış demo verisi.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* deepin.security platform kabugu.
   Birincil kaynak: platform.deepin.space ekran goruntusu. Olculer ornekten alindi
   (yazi boyutu Poppins genislik eslemesiyle, renk ve cizgi tonlari dogrudan ornekten).
   Ikincil kaynak: deepin/src/base.css (Poppins, JetBrains Mono, yesil vurgu). */
:root{
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ink:#143037; --ink-2:#44565e; --muted:#727c8a; --muted-2:#7b8a90; --faint:#b1b6bf; --ph:#99a0ac;
  --bg:#ffffff; --soft:#f8f9fb; --soft-2:#f9fafb; --line:#eaeaeb; --line-2:#ececed; --frame:#eaf0fc; --frame-2:#eef2fc; --btn-b:#eaeff9;
  --mint:#13dca7; --mint-b:#54e0b0; --logo:#00e695; --accent:#158867; --accent-soft:#eaf6f1; --accent-ink:#0b5a43;
  --hi:#f18f80; --hi-soft:#fdeeeb; --hi-ink:#b34a36;
  --md:#ca8505; --md-soft:#fcf4e4; --md-ink:#9a6604;
  --lo:#9dca85; --lo-soft:#eff6ea; --lo-ink:#4f7d38;
  --sky:#51afc5; --tip:#143037;
  --shadow:0 1px 2px rgba(20,48,55,.04),0 8px 24px -12px rgba(20,48,55,.14);
  --head:63px; --rail:72px; --panel:300px; --rrail:70px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
svg{display:block}
.ic{height:15px;width:auto;fill:currentColor;flex:none}
.ic-s{height:13px;width:auto;fill:currentColor;flex:none}
.ic.ic-line,.ic-s.ic-line{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.ic-line{width:16px;height:16px}
.ic-s.ic-line{width:13px;height:13px}
*{scrollbar-width:thin;scrollbar-color:#dfe3e8 transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#e1e5ea;border-radius:8px;border:2px solid #fff}
::-webkit-scrollbar-track{background:transparent}

/* ---------- kabuk ---------- */
.app{height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:var(--head) minmax(0,1fr);grid-template-columns:var(--rail) var(--panel) minmax(0,1fr) var(--rrail);grid-template-areas:"head head head head" "rail chat main rrail"}
.head{grid-area:head;display:flex;align-items:center;justify-content:space-between;padding:0 21px 0 29px;border-bottom:2px solid var(--frame-2);background:#fff;position:relative;z-index:8}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:29px;width:auto}
.brand .sep{width:3px;height:24px;border-radius:1px;background:var(--logo);margin:-5px 11px 0 11px;flex:none}
.brand .prod{font-weight:300;font-size:32px;line-height:1;letter-spacing:-.005em;color:var(--ink);margin-top:-7px}
.head-r{display:flex;align-items:center;gap:12px}
.lang{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.lang button{width:45px;height:29px;border-radius:9px;font-weight:400;font-size:16px;color:var(--ink);transition:background .15s,color .15s}
.lang button.on{background:#fff;color:var(--mint);box-shadow:0 1px 1px rgba(20,48,55,.03)}
.menu-btn{display:none;width:38px;height:38px;border-radius:11px;background:var(--soft);align-items:center;justify-content:center}
.menu-btn .ic{height:17px}

/* ---------- sol ray ---------- */
.rail{grid-area:rail;min-height:0;background:var(--soft);border-top-right-radius:14px;padding:28px 0 21px;display:flex;flex-direction:column;align-items:center;gap:17px;position:relative;z-index:7}
@media (max-height:700px){.rail{gap:12px;padding-top:20px;overflow-y:auto;scrollbar-width:none}}
.rb{position:relative;width:44px;height:44px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--btn-b);display:grid;place-items:center;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.rb .ic{height:15px}
.rb:hover{border-color:#dbe3f2;box-shadow:0 4px 12px -6px rgba(20,48,55,.22)}
.rb.on{border-color:#cdeee2}
.rb .n{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--hi);color:#fff;font-size:9.5px;font-weight:600;line-height:12px;text-align:center;border:2px solid var(--soft)}
.rb .tip{position:absolute;left:calc(100% + 11px);top:50%;transform:translate(-3px,-50%);background:var(--tip);color:#fff;font-weight:600;font-size:15px;line-height:1;padding:7px 12px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;z-index:30}
.rb .tip::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:var(--tip)}
.rb:hover .tip,.rb:focus-visible .tip{opacity:1;transform:translate(0,-50%)}
.rail .grow{flex:1}
.avatar{width:39px;height:39px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;border:0}
.avatar:hover{border:0;box-shadow:0 4px 12px -6px rgba(20,48,55,.5)}
.avatar .ic{height:16px}
.rrail{grid-area:rrail;min-height:0;background:var(--soft);border-left:1px solid var(--frame);padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;z-index:7}
.rrail .rb{width:42px;height:42px}
.rrail .rb .ic{height:14px}
.rrail .rb .tip{left:auto;right:calc(100% + 11px);transform:translate(3px,-50%)}
.rrail .rb:hover .tip{transform:translate(0,-50%)}
.rrail .rb .tip::before{left:auto;right:-6px;border:6px solid transparent;border-right:0;border-left-color:var(--tip)}

/* ---------- sohbet paneli ---------- */
.chat{grid-area:chat;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff;z-index:6}
.chat-in{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.back{display:inline-flex;align-items:center;gap:16px;font-size:16px;font-weight:400;padding:26px 0 6px 44px;align-self:flex-start;color:var(--ink);z-index:2}
.back .ic{width:18px;height:18px;stroke-width:2.3}
.back:hover span{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint)}
.back[hidden]{display:none}
.wm{position:absolute;left:-2px;top:50%;transform:translateY(-50%);display:flex;align-items:center;pointer-events:none;opacity:.17;white-space:nowrap;transition:opacity .3s;z-index:0}
.wm img{height:52px;width:auto}
.wm .sep{width:5px;height:38px;border-radius:2px;background:var(--logo);margin:-8px 18px 0 18px}
.wm span:last-child{font-size:51px;font-weight:300;line-height:1;color:var(--ink);margin-top:-11px}
.chat.dolu .wm{opacity:0}
.feed{flex:1;min-height:0;overflow-y:auto;padding:10px 18px 14px 20px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.msg{max-width:100%;font-size:14px;line-height:1.55;animation:gel .25s ease-out}
@keyframes gel{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:88%;font-size:13.5px}
.msg.a{align-self:stretch;color:var(--ink)}
.msg.a .who{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.msg.a .who img{width:16px;height:16px}
.msg.a ul{margin:7px 0 0;padding-left:17px;display:grid;gap:4px}
.msg.a li::marker{color:var(--mint)}
.msg.a table{margin-top:9px}
.msg.a .dyk{margin-top:8px;font-size:11.5px;color:var(--muted)}
.typing{display:inline-flex;gap:5px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:nb 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes nb{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--ink);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--mint-b);background:#f4fcf9}
.chip.p{background:var(--ink);border-color:var(--ink);color:#fff}
.mini{display:grid;gap:6px;margin-top:9px}
.mini button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:9px 11px 9px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;position:relative;overflow:hidden}
.mini button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--md)}
.mini button.yuksek::before{background:var(--hi)}.mini button.dusuk::before{background:var(--lo)}
.mini button:hover{background:var(--soft-2)}
.mini b{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
.mini small{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.4}
.mini .r{font-size:11.5px;color:var(--muted);text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.kpis div{background:var(--soft);border-radius:10px;padding:7px 4px;text-align:center}
.kpis b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.kpis span{font-size:10.5px;color:var(--muted)}
.chat-foot{padding:0 17px 10px 14px;position:relative;z-index:2;background:#fff}
.cf-top{display:flex;align-items:center;padding:0 0 5px 7px;margin:0 6px 18px -6px;border-bottom:1px solid #f1f3f7}
.news{width:36px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink);margin-left:-5px}
.news .ic{height:24px}
.news:hover{background:var(--soft)}
.ask{display:flex;align-items:center;gap:10px;border:1px solid var(--mint-b);border-radius:14px;padding:0 34px 0 27px;height:65px;background:#fff;transition:box-shadow .2s}
.ask:focus-within{box-shadow:0 0 0 4px rgba(19,220,167,.12)}
.ask input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;color:var(--ink);background:none;padding:0}
.ask input::placeholder{color:var(--ph);opacity:1}
.ask button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink);flex:none}
.ask button .ic{height:15px}
.ask button:hover{background:var(--soft)}
.disc{text-align:center;font-size:12.5px;color:var(--ink);margin-top:9px;line-height:1.45;padding:0 8px}
.handle{position:absolute;right:-17px;top:110px;z-index:12;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #eef1f6;box-shadow:0 2px 8px rgba(20,48,55,.09);display:grid;place-items:center;color:var(--sky);cursor:col-resize}
.handle .ic{height:14px}
.handle:hover{color:#2f93ad}

/* ---------- ana kart ---------- */
.main{grid-area:main;min-width:0;min-height:0;display:flex;background:#fff;position:relative;z-index:5}
.card{flex:1;min-width:0;background:#fff;border-left:1px solid var(--frame);border-top:1px solid var(--frame);border-top-left-radius:14px;margin-top:-2px;overflow-y:auto;padding:43px 16px 56px 16px;position:relative}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--ink)}
.top .sub{color:var(--muted);font-size:15px;margin-top:15px;font-weight:400}
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none;margin-top:-17px}
.xbtn{width:17px;height:17px;display:grid;place-items:center;color:var(--ink)}
.xbtn .ic{height:15px}
.xbtn:hover{color:var(--hi-ink)}
.xyer{height:17px}
.donem{position:relative}
.donem>button{font-weight:600;font-size:15px;display:flex;align-items:flex-start;gap:5px;line-height:1.3}
.donem>button span{padding-bottom:5px;border-bottom:2px solid var(--ink)}
.donem>button .ic-s{width:11px;height:11px;stroke-width:2.4;margin-top:6px;color:var(--muted)}
.donem ul,.sort ul{position:absolute;right:0;top:calc(100% + 8px);list-style:none;margin:0;padding:5px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:200px;z-index:20;display:none}
.donem.acik ul,.sort.acik ul{display:block;animation:gel .15s ease-out}
.donem li button,.sort li button{width:100%;text-align:left;padding:8px 11px;border-radius:8px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;color:var(--ink)}
.donem li button:hover,.sort li button:hover{background:var(--soft)}
.donem li button.on,.sort li button.on{font-weight:600;color:var(--accent)}

/* risk sekmeleri */
.tabs4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:21.5px;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.t4{position:relative;text-align:left;padding:12px 19px 11px;border-right:1px solid var(--line);display:block;min-width:0;background:var(--soft);transition:background .15s}
.t4:last-child{border-right:0}
.t4.on{background:#fff}
.t4.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
.t4 .top4{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.t4 .num{font-size:27px;font-weight:700;line-height:1;color:var(--c);letter-spacing:-.01em}
.t4 .lab{font-size:15px;font-weight:600;color:var(--ink);line-height:1}
.t4.bos .lab{color:var(--muted-2)}
.t4 .sb{display:block;margin-top:6px;line-height:17px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t4.bos .sb{color:var(--faint)}
.t4:hover:not(.on){background:#fbfbfc}

.listbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:21px;flex-wrap:wrap}
.listbar h2{font-size:15px;font-weight:600;letter-spacing:0}
.listbar h2 span{font-weight:400;color:var(--muted)}
.sort{position:relative}
.sort>button{display:flex;align-items:center;gap:6px;height:32px;border:1px solid #ededee;border-radius:8px;padding:0 11px 0 13px;font-size:13.5px;color:var(--muted);background:#fff}
.sort>button b{font-weight:500;color:var(--ink)}
.sort>button .ic-s{width:12px;height:12px;stroke-width:2.4;color:var(--ink)}
.sort>button:hover{border-color:#dcdfe3}

/* liste satirlari */
.rows{margin-top:8px;border-top:1px solid var(--line-2)}
.row{border-bottom:1px solid var(--line-2);position:relative}
.row-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:start;padding:17px 0 16px 16px;cursor:pointer;position:relative;text-align:left;width:100%;transition:background .15s}
.row-h::before{content:"";position:absolute;left:0;top:15px;bottom:15px;width:3px;border-radius:2px;background:var(--c)}
.row-h:hover{background:linear-gradient(90deg,#fbfcfd,#fff 60%)}
.row.yuksek{--c:var(--hi)}.row.orta{--c:var(--md)}.row.dusuk{--c:var(--lo)}
.rt{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.005em;line-height:1.35;color:#0f252b;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rt .yeni{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);line-height:1.4}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.rchip{display:inline-flex;align-items:center;gap:4px;height:22px;background:var(--soft-2);border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:10.5px;font-weight:500;color:#626e7e;white-space:nowrap}
.rchip b{font-weight:700;color:var(--ink)}
.rsag{display:flex;align-items:center;gap:11px;margin-top:6px}
.pill{display:inline-flex;align-items:center;height:28px;border:1px solid var(--line);background:var(--soft-2);border-radius:999px;padding:0 17px;font-size:13px;color:#757e8c;white-space:nowrap}
.chev{width:26px;height:26px;display:grid;place-items:center;color:#707a89;transition:transform .2s,color .15s;margin:-5px -7px 0 0;border-radius:7px}
.chev .ic{width:24px;height:24px;stroke-width:1.8}
.chev:hover{color:var(--ink);background:var(--soft)}
.row.acik .chev{transform:rotate(180deg)}
.rdet{display:none;padding:0 0 20px 16px}
.row.acik .rdet{display:block;animation:gel .18s ease-out}
.rdet .ozt{color:var(--ink-2);font-size:13.5px;margin:0 0 12px;max-width:80ch}
.sub-u{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sub-u div{display:grid;grid-template-columns:130px minmax(0,1fr) auto 54px;gap:14px;align-items:center;padding:9px 14px;font-size:13px;border-bottom:1px solid #f1f2f4;background:#fff}
.sub-u div:last-child{border-bottom:0}
.sub-u b{font-weight:600;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-u span{color:var(--ink-2)}
.sub-u small{color:var(--muted);font-size:12px;white-space:nowrap}
.sub-u small:last-child{text-align:right}
.rdet .go{margin-top:12px}
.bos-liste{padding:56px 20px;text-align:center;color:var(--muted);font-size:14px}
.bos-liste b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px;font-weight:600}

/* ortak bilesenler */
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:500;font-size:13.5px;height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:#cfd5dc}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.p:hover{background:#1d3f47}
.btn.s{height:30px;padding:0 13px;font-size:12.5px}
.btn .ic-s{height:12px}
.btn .ic-s.ic-line{width:12px;height:12px}
.risk{display:inline-flex;align-items:center;height:22px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:0 9px;border-radius:6px;font-weight:600;white-space:nowrap}
.risk.yuksek{background:var(--hi-soft);color:var(--hi-ink)}.risk.orta{background:var(--md-soft);color:var(--md-ink)}.risk.dusuk{background:var(--lo-soft);color:var(--lo-ink)}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;font-size:11px;font-weight:500;padding:0 10px;border-radius:999px;background:var(--soft-2);border:1px solid var(--line);color:#6d7786;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mint)}
.mt{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--soft-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.mtl{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint));flex:none}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft-2)}
table.t td{padding:10px 13px;border-bottom:1px solid #f1f2f4;vertical-align:top;color:var(--ink)}
table.t td.nw{white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.lnk{cursor:pointer}
table.t tr.lnk:hover td{background:var(--soft-2)}
table.t td .who{font-family:var(--mono);font-size:12.5px}
.tw{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff}
.tw table.t th{position:sticky;top:0}
.tw table.t tr:last-child td{border-bottom:0}
.msg table.t{font-size:12px}
.msg table.t td,.msg table.t th{padding:6px 8px}
.msg table.t th{white-space:normal;line-height:1.35}
.card h3.sec{font-size:13px;letter-spacing:0;color:var(--ink);font-weight:600;margin:30px 0 12px}

/* ---------- inceleme dosyasi ---------- */
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead .geri{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink)}
.dhead .geri .ic{width:14px;height:14px;stroke-width:2}
.dhead .geri:hover{border-color:#cfd5dc}
.dhead .crumb{font-size:13px;color:var(--muted)}
.dtitle{margin-top:18px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.dtitle>div:first-child{flex:1 1 380px;min-width:0}
.dtitle h1{font-size:25px;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;line-height:1.25}
.dtitle .alt{color:var(--muted);font-size:15px;margin-top:7px}
.dbadges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.dtabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{padding:10px 13px 11px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.dtabs button:hover{color:var(--ink)}
.dtabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.dtabs em{font-style:normal;font-size:11px;background:var(--soft-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);font-weight:500;line-height:18px}
.verdict{margin-top:22px;padding:15px 18px 15px 22px;border-radius:12px;background:var(--soft-2);border:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--ink);position:relative;overflow:hidden}
.verdict::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--md)}
.verdict.yuksek::before{background:var(--hi)}
.verdict.dusuk::before{background:var(--lo)}
.neden{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.neden span{display:inline-flex;align-items:center;gap:7px;height:24px;font-size:12px;font-weight:500;background:var(--soft-2);border:1px solid var(--line);border-radius:999px;padding:0 11px;color:#6d7786}
.neden span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint)}
.mitrow{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.mitrow .lab{font-size:12px;font-weight:600;color:var(--muted)}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.fg div{background:var(--soft);border-radius:10px;padding:10px 14px;min-width:0}
.fg span{display:block;font-size:12px;color:var(--muted);margin-bottom:1px}
.fg b{font-weight:600;font-size:14px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.met{border:1px solid var(--line);border-radius:12px;padding:13px 16px;background:#fff}
.met b{display:block;font-size:23px;font-weight:700;line-height:1.15;color:var(--ink);letter-spacing:-.01em}
.met.w b{color:var(--hi)}
.met span{font-size:13px;color:var(--muted)}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.step i{width:20px;height:20px;border-radius:6px;border:1.5px solid #d5dae0;display:block;cursor:pointer;position:relative}
.step.ok i{background:var(--accent);border-color:var(--accent)}
.step.ok i::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.step b{font-weight:600;font-size:14px}
.step.ok b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.step small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.own{font-size:12px;color:var(--ink-2);background:var(--soft);border-radius:999px;padding:3px 11px;white-space:nowrap}
.eks{display:grid;gap:10px}
.eks div{border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:#fff}
.eks b{display:block;font-size:14.5px;font-weight:600}
.eks dl{display:grid;grid-template-columns:140px 1fr;gap:5px 14px;margin:9px 0 0;font-size:13.5px}
.eks dt{color:var(--muted)}
.eks dd{margin:0;color:var(--ink-2)}
.lead{color:var(--muted);font-size:14px;max-width:74ch;margin-top:18px}

/* zaman */
.spark{display:flex;align-items:flex-end;gap:10px;height:104px;margin-top:22px;padding:14px 16px 10px;border:1px solid var(--line);border-radius:12px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.spark i{display:block;width:100%;max-width:56px;background:var(--mint-b);border-radius:6px 6px 2px 2px;min-height:3px}
.spark div.b i{background:#eef0f3}
.spark small{font-size:11.5px;color:var(--muted)}
.spark b{font-size:12px;font-weight:600}
.tl{list-style:none;margin:24px 0 0;padding:0 0 0 28px;position:relative}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:14px;width:2px;background:#eef0f3;border-radius:1px}
.tl li{position:relative;padding:0 0 20px}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--sky)}
.tl li.uyari::before{border-color:var(--md)}
.tl li.kritik::before{border-color:var(--hi);box-shadow:0 0 0 4px rgba(241,143,128,.16)}
.tl .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl b{display:block;font-weight:600;font-size:14.5px;margin-top:1px}
.tl p{color:var(--ink-2);font-size:13.5px;margin-top:1px}
.tl .ks{display:inline-flex;margin-top:6px;font-size:11px;font-weight:500;color:#6d7786;border:1px solid var(--line);background:var(--soft-2);border-radius:999px;padding:0 9px;line-height:20px}

/* graf */
.gwrap{margin-top:20px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--soft-2)}
.gbar .lab{font-size:12.5px;color:var(--muted)}
.gsel{display:flex;gap:5px;flex-wrap:wrap}
.gsel button{height:26px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:500;font-family:var(--mono)}
.gsel button:hover{border-color:#cfd5dc}
.gsel button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gleg{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--ink-2)}
.gleg i{display:inline-block;width:20px;height:0;border-top:2.5px solid var(--c);vertical-align:middle;margin-right:6px;border-radius:2px}
.gleg i.k{border-top-style:dashed}
.gsvg{width:100%;height:auto;display:block;background:#fff}
.gnode{cursor:pointer}
.gnode rect{transition:stroke-width .15s}
.gnode:hover rect{stroke-width:2.4}
.gnode.sel rect{stroke:var(--ink);stroke-width:2.6}
.gside{border-top:1px solid var(--line);padding:15px 18px;background:#fff;font-size:13.5px}
.gside h4{font-size:14px;font-weight:600;margin-bottom:9px}
.gside dl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:7px 20px;margin:0}
.gside dt{color:var(--muted);font-size:12.5px}
.gside dd{margin:0;color:var(--ink);font-size:13px;font-weight:500;word-break:break-word}
.gside .bos{color:var(--muted);font-size:13px}
.gcap{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--soft-2)}

/* log */
.log{margin-top:6px;border:1px solid #1d3a41;border-radius:12px;background:#10262c;color:#d3e6e1;font-family:var(--mono);font-size:11.5px;line-height:1.75;overflow:auto;max-height:330px;padding:6px 0}
.log div{padding:0 16px;white-space:pre}
.log div:hover{background:rgba(255,255,255,.04)}
.log em{font-style:normal;color:#6ff0c8}
.log .ln{color:#58766f;margin-right:14px;user-select:none}
.logh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
.logh code{font-family:var(--mono);font-size:11.5px;background:var(--soft-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink-2)}

/* genel sayfa gorunumleri */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}
.search{display:flex;align-items:center;gap:9px;border:1px solid #ededee;border-radius:8px;height:34px;padding:0 12px;min-width:280px;background:#fff}
.search:focus-within{border-color:var(--mint-b);box-shadow:0 0 0 3px rgba(19,220,167,.1)}
.search input{border:0;outline:0;font:inherit;font-size:13.5px;flex:1;min-width:0;background:none;color:var(--ink)}
.search input::placeholder{color:var(--ph)}
.search .ic-s{color:var(--muted);height:13px}
select.sel{height:34px;border:1px solid #ededee;border-radius:8px;padding:0 10px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
select.sel:focus{outline:2px solid var(--mint-b)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--c,var(--mint));vertical-align:middle}
.barw{display:flex;align-items:center;gap:8px}
.barw span:not(.bar){font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2);min-width:24px}

/* mitre */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px;margin-top:22px;align-items:start}
.mcol{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.mcol h4{font-size:13px;font-weight:600;padding:10px 13px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--ink)}
.mcol h4 span{font-weight:500;color:var(--muted)}
.mcol .tiles{display:grid;gap:6px;padding:8px}
.tile{text-align:left;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;display:block;width:100%;position:relative;transition:border-color .15s,box-shadow .15s}
.tile.var{border-color:#efd9ad;background:#fffaf0}
.tile.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(20,48,55,.08)}
.tile small{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block}
.tile b{font-weight:600;font-size:13px;line-height:1.3;display:block;margin-top:1px;padding-right:22px}
.tile .cnt{position:absolute;top:8px;right:9px;min-width:20px;height:20px;border-radius:999px;background:var(--md);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.tile:hover{border-color:#cfd5dc}

/* ag */
.kpis3{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:20px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.kp{padding:15px 19px 16px;border-right:1px solid var(--line)}
.kp:last-child{border-right:0}
.kp b{display:block;font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.kp span{font-size:13px;color:var(--muted);display:block;margin-top:6px}
.gh td{background:var(--soft-2);font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:9px 13px !important;border-bottom:1px solid var(--line) !important}
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%}
.heat th{font-weight:500;font-size:11px;color:var(--ink-2);padding:6px 4px;text-align:center;vertical-align:bottom;line-height:1.25}
.heat th.rh{text-align:right;padding-right:10px;white-space:nowrap}
.heat td{height:42px;text-align:center;border-radius:7px;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;cursor:default;min-width:58px}
.heat td.z{background:var(--soft);color:var(--faint);font-weight:400}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,48,55,.08)}

/* kisi sorgusu */
.kis-h{display:flex;gap:16px;align-items:center;margin-top:24px;flex-wrap:wrap}
.kav{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;font-weight:600}
.kis-h h2{font-size:20px;font-weight:600}
.kis-h p{color:var(--muted);font-size:14px}
.hk{display:grid;gap:8px;margin-top:20px}
.hk div{display:flex;gap:12px;align-items:flex-start;padding:11px 15px;border-radius:12px;background:var(--soft);font-size:14px}
.hk .dot{margin-top:7px}
.chp{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:0 9px;line-height:21px;border-radius:999px;margin:2px 4px 2px 0;background:var(--soft-2);border:1px solid var(--line);color:#6d7786}
.chp.uyari{background:var(--md-soft);border-color:#f1dfb9;color:var(--md-ink)}
.chp.kritik{background:var(--hi-soft);border-color:#f5cfc7;color:var(--hi-ink)}

/* kaynaklar */
.kcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.kc{border:1px solid var(--line);border-radius:12px;padding:15px 18px;background:#fff}
.kc b{display:block;font-size:14.5px;font-weight:600}
.kc p{color:var(--muted);font-size:13px;margin-top:3px}
.kc em{display:inline-flex;margin-top:9px;font-style:normal;font-size:11px;font-weight:500;color:#6d7786;background:var(--soft-2);border:1px solid var(--line);padding:0 10px;line-height:21px;border-radius:999px}
.ok{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--accent-ink)}
.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}

/* cekmece */
.drawer{position:fixed;top:var(--head);right:var(--rrail);bottom:0;width:360px;max-width:92vw;background:#fff;border-left:1px solid var(--frame);box-shadow:-18px 0 36px -28px rgba(20,48,55,.28);z-index:40;transform:translateX(calc(100% + var(--rrail) + 40px));transition:transform .24s ease;display:flex;flex-direction:column}
.drawer.acik{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.dr-h h3{font-size:17px;font-weight:600}
.dr-b{flex:1;overflow-y:auto;padding:0 20px 20px}
.dr-x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.dr-x .ic{width:15px;height:15px}
.dr-x:hover{background:var(--soft)}
.dr-b .search{min-width:0;margin-bottom:8px}
.ent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid #f1f2f4;width:100%;text-align:left}
.ent:hover{background:var(--soft-2)}
.ent .ei{width:32px;height:32px;border-radius:9px;background:var(--soft);border:1px solid var(--btn-b);display:grid;place-items:center;color:var(--ink)}
.ent .ei .ic{height:13px}
.ent b{display:block;font-size:13px;font-weight:600;word-break:break-all}
.ent small{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--tip);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.g{opacity:1;transform:translate(-50%,0)}
.note{margin-top:32px;font-size:12px;color:var(--faint)}

/* ---------- duyarlilik ---------- */
@media (max-width:1280px){
  :root{--panel:280px}
  .gside dl{grid-template-columns:auto 1fr}
  .kpis3{grid-template-columns:repeat(2,1fr)}
  .kp:nth-child(2){border-right:0}.kp:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:1080px){
  .app{grid-template-columns:var(--rail) minmax(0,1fr) var(--rrail);grid-template-areas:"head head head" "rail main rrail"}
  .chat{position:fixed;left:var(--rail);top:var(--head);bottom:0;width:min(330px,86vw);z-index:35;transform:translateX(calc(-100% - var(--rail) - 40px));transition:transform .25s;border-right:1px solid var(--frame)}
  .chat.acik{transform:none;box-shadow:24px 0 40px -30px rgba(20,48,55,.35)}
  .menu-btn{display:flex}
  .handle{display:none}
  .fg,.mets{grid-template-columns:repeat(2,1fr)}
  .t4{padding:13px 14px 15px}
  .t4 .top4{gap:7px}
}
@media (max-width:760px){
  :root{--rail:0px;--rrail:0px;--head:58px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main"}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;flex-direction:row;justify-content:space-around;padding:8px;border-radius:16px 16px 0 0;z-index:36;gap:4px;border-top:1px solid var(--frame)}
  .rail .grow,.rail .avatar,.rrail{display:none}
  .rb{width:42px;height:42px}
  .rb .tip{display:none}
  .card{padding:22px 16px 90px;border-radius:0;border-left:0}
  .chat{left:0;width:100vw}
  .tabs4{grid-template-columns:1fr 1fr}
  .t4:nth-child(2){border-right:0}.t4:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .top h1,.dtitle h1{font-size:21px}
  .top-r{margin-top:0}
  .fg,.mets,.kpis3{grid-template-columns:1fr}
  .kp{border-right:0;border-bottom:1px solid var(--line)}
  .head{padding:0 14px}
  .brand img{height:23px}.brand .sep{height:19px;margin:-4px 9px 0 9px}.brand .prod{font-size:25px;margin-top:-5px}
  .head-r{gap:8px}.lang button{width:38px;height:27px;font-size:14px}
  .sub-u div{grid-template-columns:1fr auto;gap:2px 10px}
  .sub-u span{grid-column:1/-1}
  .eks dl{grid-template-columns:1fr}
  .drawer{right:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html.tur,html.tur *{cursor:none!important}
html.tur .card,html.tur .feed{scroll-behavior:auto!important}
html.tur:not(.temiz) body{--tur-ust:22px;--tur-yan:60px;--tur-alt:118px;background:radial-gradient(900px 420px at 50% 112%,rgba(19,220,167,.22),rgba(19,220,167,0) 70%),radial-gradient(700px 380px at 8% -10%,rgba(84,224,176,.10),rgba(84,224,176,0) 70%),linear-gradient(180deg,#143037 0%,#0d2126 100%);overflow:hidden}
html.tur:not(.temiz) #kok{position:fixed;inset:0}
html.tur:not(.temiz) .app{position:absolute;left:var(--tur-yan);top:var(--tur-ust);width:calc(100vw - 2 * var(--tur-yan));height:calc(100vh - var(--tur-ust) - var(--tur-alt));border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 34px 80px -24px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);transform:translateZ(0)}
#imlec{position:fixed;left:0;top:0;width:28px;height:32px;margin:-3px 0 0 -4px;z-index:2147483600;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(20,48,55,.3));will-change:transform}
#imlec svg{display:block;transform-origin:4px 3px}

function gorunen(){
  const bas = DONEMLER.find(d => d.k === S.donem).bas;
  const l = D.incelemeler.map(inc => ({inc, u:inc.uyarilar.map(x => UY[x]).filter(x => x.gun >= bas)})).filter(x => x.u.length);
  const son = x => x.u.reduce((m, y) => (y.gun > m ? y.gun : m), '');
  if (S.sirala === 'uyari') l.sort((a, b) => b.u.length - a.u.length || b.inc.puan - a.inc.puan);
  else if (S.sirala === 'son') l.sort((a, b) => (son(b) > son(a) ? 1 : son(b) < son(a) ? -1 : b.inc.puan - a.inc.puan));
  else l.sort((a, b) => b.inc.puan - a.inc.puan);
  return l;
}
function turSay(u){
  const m = {};
  u.forEach(x => { m[x.tur] = (m[x.tur] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
const kisiVar = ad => !!D.kisiler[ad];
const yuzde = v => DIL === 'en' ? Math.round(v * 100) + '%' : '%' + Math.round(v * 100);
const varlikHtml = (ad, tip) => (tip === 'kisi' && D.haftalar[ad]) ? `<a href="#/kisi/${esc(ad)}" class="who" style="text-decoration:none;border-bottom:1px dotted var(--faint)">${esc(ad)}</a>` : `<span class="who">${esc(ad)}</span>`;
const norm = s => String(s).toLocaleLowerCase(DIL).replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9 ]/g,' ');
const oncBadge = k => `<span class="risk ${k}">${ONC[k].ad}</span>`;

/* ---------------------------------------------------------------- yonlendirme */
function rotaOku(){
  const h = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  const a = h[0] || 'home';
  S.rota = a; S.incId = null;
  if (a === 'inc') {
    if (INC[h[1]]) { S.incId = h[1]; S.tab = h[2] || 'genel'; }
    else { S.rota = 'home'; }
  }
  if (a === 'kisi' && h[1] && D.haftalar[h[1]]) S.kisi = h[1];
  if (a === 'graf') {
    const g = D.incelemeler.find(i => i.graf);
    if (g) { location.replace('#/inc/' + g.id + '/graf'); return false; }
  }
  return true;
}
function git(p){ location.hash = '#/' + p; }
const geri = () => { if (history.length > 1) history.back(); else git(''); };

function satir(x){
  const inc = x.inc;
  const chips = turSay(x.u).map(([ad, n]) => `<span class="rchip">${esc(ad)} <b>${n}</b></span>`).join('');

  const kaynaklar = inc.kaynaklar.map(KAYNAK_AD).join(', ');
  const acik = S.acik.has(inc.id);
  const alt = x.u.slice(0, 4).map(y => `<div><b>${esc(y.varlik)}</b><span>${esc(y.ne)}</span><small>${esc(KAYNAK_AD(y.kaynak))}</small><small>${gunEt(y.gun)}</small></div>`).join('')
    + (x.u.length > 4 ? `<div><b>${tt('+{0} uyarı daha', x.u.length - 4)}</b><span>${tt('İnceleme dosyasında listelenir')}</span><small></small><small></small></div>` : '');
  return `<div class="row ${inc.oncelik} ${acik ? 'acik' : ''}" data-id="${inc.id}">
    <div class="row-h" role="link" tabindex="0" data-a="ac-inc" data-p="${inc.id}" aria-label="${tt('{0} incelemesini aç', esc(inc.baslik))}">
      <div><div class="rt">${esc(inc.baslik)}${bugun ? `<span class="yeni">${tt('bugün')}</span>` : ''}</div>
        <div class="rchips">${chips}</div></div>

    </div>
    <div class="rdet"><p class="ozt">${esc(inc.kart_ozet)} <span style="color:var(--muted)">· ${esc(kaynaklar)}</span></p><div class="sub-u">${alt}</div>
      <button class="btn p s go" data-a="ac-inc" data-p="${inc.id}">${tt('İncelemeyi aç')} ${icoS('chevr')}</button></div>
  </div>`;
}

function tabKanit(inc){
  return inc.kanit.map(k => `<h3 class="sec">${esc(k.baslik)}</h3>${tablo(k)}`).join('') + hamHtml(inc);

function tabZaman(inc){
  const say = {};
  inc.uyarilar.forEach(id => { const g = UY[id].gun; say[g] = (say[g] || 0) + 1; });
  const mx = Math.max.apply(null, Object.values(say).concat([1]));

function tabEksik(inc){

/* ---------------------------------------------------------------- graf */
const SINIF = {
  normal:{ad:tt('Grubun da gittiği ağ'), c:'#158867', bg:'#eaf6f1', dash:''},
  yalniz:{ad:tt('Yalnız bu kişinin ulaştığı ağ'), c:'#ca8505', bg:'#fbf1df', dash:''},
  engel:{ad:tt('Denedi, engellendi'), c:'#e2725f', bg:'#fbe4df', dash:'6 5'},
  grup_engel:{ad:tt('Grubun da engellendiği ağ'), c:'#9aa3ad', bg:'#f3f5f8', dash:'6 5'}
};
const SINIF_DUR = {
  normal:tt('Ulaşıldı; grubun başka üyeleri de gidiyor'),
  yalniz:tt('Ulaşıldı; yalnız bu kişi gidiyor'),
  engel:tt('Engellendi; hiçbir istek geçmedi'),
  grup_engel:tt('Engellendi; grubun başka üyeleri de aynı ağı deniyor')
};
function kalinlik(n){ return Math.min(11, 1.4 + Math.log10(n + 1) * 2.6); }
function grafKur(inc, kisi){
  const ag = kisi.ag;
  const sinifDizisi = ['normal', 'yalniz', 'engel', 'grup_engel'];
  const tavan = {normal:4, yalniz:4, engel:6, grup_engel:1};
  const gruplar = sinifDizisi.map(s => {
    const hepsi = ag.filter(x => x.sinif === s).sort((a, b) => b.istek - a.istek);
    const toplam = s === 'engel' ? Math.max(kisi.ozet.engel, hepsi.length) : hepsi.length;
    let goster = hepsi.slice(0, tavan[s]);
    let ekle = null;
    if (s === 'grup_engel' && hepsi.length) { goster = []; ekle = {kume:true, sinif:s, adet:hepsi.length, istek:hepsi.reduce((a, x) => a + x.istek, 0), grup_pay:hepsi[0].grup_pay}; }
    else if (toplam > goster.length) ekle = {kume:true, sinif:s, adet:toplam - goster.length, istek:(s === 'engel' && kisi.engel_istek != null) ? kisi.engel_istek - goster.reduce((a, x) => a + x.istek, 0) : hepsi.slice(goster.length).reduce((a, x) => a + x.istek, 0), grup_pay:0};
    return {s, goster, ekle, toplam};
  }).filter(g => g.goster.length || g.ekle);
  const W = 1000, NX = 590, NW = 360, NH = 44, GAP = 10, BAND = 32;
  let y = 24;
  const dugumler = [];
  const basliklar = [];
  gruplar.forEach(g => {
    basliklar.push({y, s:g.s, toplam:g.toplam});
    y += BAND;
    g.goster.forEach(x => { dugumler.push(Object.assign({}, x, {y, id:'d' + dugumler.length})); y += NH + GAP; });
    if (g.ekle) { dugumler.push(Object.assign({}, g.ekle, {y, id:'d' + dugumler.length})); y += NH + GAP; }
    y += 10;
  });
  const H = Math.max(y + 10, 480);
  const gx = 140, gy = 120, px = 140, py = Math.max(H - 120, 330);
  const kenar = dugumler.map(d => {
    const c = SINIF[d.sinif];
    const cy = d.y + NH / 2;
    const w = kalinlik(d.istek);
    const dash = c.dash ? ` stroke-dasharray="${c.dash}"` : '';
    const y0 = py;
    let s = `<path d="M ${px + 64} ${y0} C ${px + 230} ${y0}, ${NX - 170} ${cy}, ${NX} ${cy}" fill="none" stroke="${c.c}" stroke-width="${w.toFixed(1)}" stroke-opacity=".78"${dash} stroke-linecap="round"/>`;
    if ((d.sinif === 'normal' || d.sinif === 'grup_engel') && inc.graf.tur !== 'x') {
      const gw = Math.max(1.2, (d.grup_pay || .3) * 5.5);
      s += `<path d="M ${gx + 60} ${gy} C ${gx + 230} ${gy}, ${NX - 170} ${cy}, ${NX} ${cy}" fill="none" stroke="#b6bec7" stroke-width="${gw.toFixed(1)}" stroke-opacity=".55"${dash} stroke-linecap="round"/>`;
    }
    return s;
  }).join('');
  const nodeSvg = dugumler.map(d => {
    const c = SINIF[d.sinif];
    const sel = S.gdugum === d.id ? ' sel' : '';
    const dash = c.dash ? ` stroke-dasharray="${c.dash}"` : '';
    if (d.kume) {
      const bas = d.sinif === 'grup_engel' ? tt('{0} ağ', d.adet) : tt('+{0} ağ daha', d.adet);
      const alt = d.sinif === 'grup_engel' ? tt('Grubun da engellendiği ağlar') : tt('engellendi, tabloda');
      return `<g class="gnode${sel}" data-a="dugum" data-p="${d.id}" tabindex="0"><rect x="${NX}" y="${d.y}" width="${NW}" height="${NH}" rx="12" fill="${c.bg}" stroke="${c.c}" stroke-width="1.25"${dash}/><text x="${NX + 16}" y="${d.y + 20}" font-size="13" font-weight="600" fill="#143037">${bas}</text><text x="${NX + 16}" y="${d.y + 37}" font-size="12" fill="#727c8a">${alt}</text><text x="${NX + NW - 14}" y="${d.y + 28}" font-size="12" text-anchor="end" fill="#4a5d64">${tt('{0} istek', sayi(d.istek))}</text></g>`;
    }
    const ad = d.ad ? d.ad : tt('kayıtlarda tanımlı değil');
    return `<g class="gnode${sel}" data-a="dugum" data-p="${d.id}" data-c="${esc(d.cidr)}" tabindex="0"><rect x="${NX}" y="${d.y}" width="${NW}" height="${NH}" rx="12" fill="${c.bg}" stroke="${c.c}" stroke-width="1.25"${dash}/><text x="${NX + 16}" y="${d.y + 20}" font-size="13" font-weight="600" fill="#143037" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">${esc(d.cidr)}</text><text x="${NX + 16}" y="${d.y + 37}" font-size="12" fill="#727c8a"${d.ad ? '' : ' font-style="italic"'}>${esc(ad)}</text><text x="${NX + NW - 14}" y="${d.y + 28}" font-size="12" text-anchor="end" fill="#4a5d64">${tt('{0} istek', sayi(d.istek))}</text></g>`;
  }).join('');
  const bas = basliklar.map(b => `<text x="${NX}" y="${b.y + 18}" font-size="12" font-weight="600" letter-spacing=".06em" fill="${SINIF[b.s].c}" style="text-transform:uppercase">${SINIF[b.s].ad.toLocaleUpperCase(DIL)}${b.toplam ? ' · ' + b.toplam : ''}</text>`).join('');
  const nuye = inc.graf.grup.uye;
  const noktalar = [];
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    noktalar.push(`<circle cx="${gx + Math.cos(a) * 58}" cy="${gy + Math.sin(a) * 58}" r="5" fill="#c9d3da"/>`);
  }
  const grupSvg = `<g>${noktalar.join('')}<circle cx="${gx}" cy="${gy}" r="44" fill="#f3f5f8" stroke="#dbe1e6" stroke-width="1.5"/><text x="${gx}" y="${gy - 2}" text-anchor="middle" font-size="24" font-weight="700" fill="#143037">${nuye}</text><text x="${gx}" y="${gy + 17}" text-anchor="middle" font-size="11.5" fill="#727c8a">${tt('kişi')}</text></g>
    <text x="${gx}" y="${gy + 84}" text-anchor="middle" font-size="12.5" font-weight="600" fill="#143037">${esc(inc.graf.grup.ad)}</text><text x="${gx}" y="${gy + 101}" text-anchor="middle" font-size="12" fill="#727c8a">${tt('benzer görevdekiler')}</text>`;
  const kisiSvg = `<g><rect x="${px - 64}" y="${py - 30}" width="128" height="60" rx="16" fill="#143037"/><text x="${px}" y="${py - 4}" text-anchor="middle" font-size="14" font-weight="600" fill="#fff" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">${esc(kisi.ad)}</text><text x="${px}" y="${py + 14}" text-anchor="middle" font-size="11.5" fill="#9fb3ba">${esc(kisi.ad_soyad)}</text></g>`;
  return {svg:`<svg class="gsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tt('{0} için ağ rotaları', esc(kisi.ad_soyad))}">${kenar}${grupSvg}${kisiSvg}${bas}${nodeSvg}</svg>`, dugumler};
}
function tabGraf(inc){
  const g = inc.graf;
  const ad = S.gkisi[inc.id] || g.kisiler[0].ad;
  const kisi = g.kisiler.find(k => k.ad === ad) || g.kisiler[0];
  const {svg, dugumler} = grafKur(inc, kisi);
  const oz = kisi.ozet;
  const secili = dugumler.find(d => d.id === S.gdugum);
  let yan;
  if (secili) {
    const c = SINIF[secili.sinif];
    yan = secili.kume
      ? `<h4>${secili.sinif === 'grup_engel' ? tt('Grubun da engellendiği ağlar') : tt('Diğer engellenen ağlar')}</h4><dl><dt>${tt('Ağ sayısı')}</dt><dd>${secili.adet}</dd><dt>${tt('İstek')}</dt><dd>${sayi(secili.istek)}</dd><dt>${tt('Durum')}</dt><dd>${SINIF_DUR[secili.sinif]}</dd></dl>`
      : `<h4 style="font-family:var(--mono);font-size:14px">${esc(secili.cidr)}</h4><dl><dt>${tt('Ağ tanımı')}</dt><dd>${secili.ad ? esc(secili.ad) : `<span style="color:var(--muted);font-style:italic;font-weight:400">${tt('kayıtlarda tanımlı değil')}</span>`}</dd><dt>${tt('Durum')}</dt><dd style="color:${c.c}">${SINIF_DUR[secili.sinif]}</dd><dt>${tt('İstek')}</dt><dd>${sayi(secili.istek)}</dd><dt>${tt('Geçen istek')}</dt><dd>${sayi(secili.gecen)}</dd><dt>${tt('İlk görülme')}</dt><dd>${gunEt(secili.gun)}</dd><dt>${tt('Benzer görevdekilerden giden')}</dt><dd>${secili.grup_pay ? tt('{0} ({1} / {2})', yuzde(secili.grup_pay), Math.round(secili.grup_pay * g.grup.uye), g.grup.uye) : tt('hiçbiri')}</dd></dl>`;
  } else {
    yan = `<h4>${esc(kisi.ad_soyad)}</h4><dl><dt>${tt('Birim')}</dt><dd>${esc(kisi.alt)}</dd><dt>${tt('Grubun da gittiği')}</dt><dd>${tt('{0} ağ', oz.normal)}</dd><dt>${tt('Yalnız bu kişinin ulaştığı')}</dt><dd>${tt('{0} ağ', oz.yalniz)}</dd><dt>${tt('Engellenen ağ, toplam')}</dt><dd>${tt('{0} ağ', sayi(oz.engel + oz.grup_engel))}</dd><dt>${tt('Yalnız bu kişinin denediği')}</dt><dd>${tt('{0} ağ', sayi(oz.engel))}</dd><dt>${tt('Grubun da engellendiği')}</dt><dd>${tt('{0} ağ', oz.grup_engel)}</dd></dl><p class="bos" style="margin-top:14px">${tt('Bir ağa tıklayın, ayrıntısı burada görünür.')}</p>`;
  }
  const secim = g.kisiler.length > 1 ? `<span class="lab">${tt('Kişi')}</span><div class="gsel">${g.kisiler.map(k => `<button class="${k.ad === kisi.ad ? 'on' : ''}" data-a="gkisi" data-p="${inc.id}|${k.ad}">${esc(k.ad)}</button>`).join('')}</div>` : `<span class="lab">${esc(kisi.ad_soyad)} · ${esc(kisi.alt)}</span>`;
  return `<div class="gwrap"><div class="gbar">${secim}<div class="gleg"><span><i style="--c:#158867"></i>${tt('Grubun da gittiği')}</span><span><i style="--c:#ca8505"></i>${tt('Yalnız bu kişi')}</span><span><i class="k" style="--c:#e2725f"></i>${tt('Engellendi')}</span><span><i style="--c:#b6bec7"></i>${tt('Grubun yolu')}</span></div></div>
  <div class="gbody"><div>${svg}</div><div class="gside">${yan}</div></div>
  <div class="gcap">${tt('Çizgi kalınlığı istek sayısını gösterir (logaritmik ölçek). Gri çizgi, benzer görevdekilerin o ağa gönderdiği isteği temsil eder.')}</div></div>`;
}

/* ---------------------------------------------------------------- tum uyarilar */
function viewUyarilar(){
  let l = D.uyarilar.slice();
  const q = norm(S.uyAra);
  if (q) l = l.filter(u => norm(u.varlik + ' ' + u.ne + ' ' + u.tur).indexOf(q) >= 0);
  if (S.uyOnc) l = l.filter(u => INC[u.inc].oncelik === S.uyOnc);
  if (S.uyKay) l = l.filter(u => u.kaynak === S.uyKay);
  l.sort((a, b) => S.uySira === 'gun' ? (a.gun < b.gun ? 1 : -1) : S.uySira === 'varlik' ? a.varlik.localeCompare(b.varlik, DIL) : b.onem - a.onem);
  const satir = l.map(u => { const inc = INC[u.inc]; return `<tr class="lnk" data-a="ac-inc" data-p="${inc.id}"><td>${esc(u.varlik)}</td><td>${esc(u.tur)}</td><td style="min-width:230px">${esc(u.ne)}</td><td>${esc(KAYNAK_AD(u.kaynak))}</td><td class="nw">${gunEt(u.gun)}</td><td class="nw"><span class="barw"><span class="bar" style="width:${Math.round(u.onem * .5)}px;--c:${u.onem >= 84 ? 'var(--hi)' : u.onem >= 60 ? 'var(--md)' : 'var(--lo)'}"></span><span>${u.onem}</span></span></td><td class="nw">${oncBadge(inc.oncelik)}</td></tr>`; }).join('');
  return `<div class="top"><div><h1>${tt('Tüm uyarılar')}</h1><p class="sub">${tt('{0} / {1} uyarı', l.length, D.uyarilar.length)} · ${esc(D.donem.etiket)}</p></div></div>
  <div class="filters"><label class="search">${icoS('search')}<input id="uyara" type="search" placeholder="${tt('Varlık, tür veya açıklama ara')}" value="${esc(S.uyAra)}" aria-label="${tt('Uyarılarda ara')}"></label>
    <select class="sel" data-a="uyonc" aria-label="${tt('Öncelik')}"><option value="">${tt('Tüm öncelikler')}</option>${Object.keys(ONC).map(k => `<option value="${k}" ${S.uyOnc === k ? 'selected' : ''}>${ONC[k].ad}</option>`).join('')}</select>
    <select class="sel" data-a="uykay" aria-label="${tt('Kaynak')}"><option value="">${tt('Tüm kaynaklar')}</option>${Object.keys(D.kaynaklar).map(k => `<option value="${k}" ${S.uyKay === k ? 'selected' : ''}>${D.kaynaklar[k].ad}</option>`).join('')}</select>
    <select class="sel" data-a="uysira" aria-label="${tt('Sıralama')}"><option value="onem" ${S.uySira === 'onem' ? 'selected' : ''}>${tt('Önem sırasına göre')}</option><option value="gun" ${S.uySira === 'gun' ? 'selected' : ''}>${tt('Yeniden eskiye')}</option><option value="varlik" ${S.uySira === 'varlik' ? 'selected' : ''}>${tt('Varlık adına göre')}</option></select></div>
  <div class="tw" style="margin-top:18px"><table class="t"><thead><tr><th>${tt('Varlık')}</th><th>${tt('Uyarı türü')}</th><th>${tt('Ne oldu')}</th><th>${tt('Kaynak')}</th><th>${tt('Gün')}</th><th>${tt('Önem')}</th><th>${tt('İnceleme')}</th></tr></thead><tbody>${satir || `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:34px">${tt('Eşleşen uyarı yok')}</td></tr>`}</tbody></table></div>`;
}

/* ---------------------------------------------------------------- mitre */
function viewMitre(){
  const uy = {};
  D.uyarilar.forEach(u => u.mitre.forEach(k => { (uy[k] = uy[k] || []).push(u); }));
  const teknikSay = Object.keys(D.mitre).length;
  const uyarili = Object.keys(uy).length;
  const uyarisayisi = D.uyarilar.filter(u => u.mitre.length).length;
  const cols = D.taktik_sirasi.map(tk => {
    const teknikler = Object.keys(D.mitre).filter(k => D.mitre[k].taktik === tk);
    return `<div class="mcol"><h4>${esc(tk)}<span>${teknikler.length}</span></h4><div class="tiles">${teknikler.map(k => `<button class="tile izl ${uy[k] ? 'var' : ''} ${S.mtSec.has(k) ? 'sel' : ''}" data-a="mtsec" data-p="${k}"><small>${k}</small><b>${esc(D.mitre[k].ad)}</b>${uy[k] ? `<span class="cnt">${uy[k].length}</span>` : ''}</button>`).join('')}</div></div>`;
  }).join('');
  const sec = Array.from(S.mtSec);
  let alt = '';
  if (sec.length) {
    const liste = [];
    const goruldu = new Set();
    sec.forEach(k => (uy[k] || []).forEach(u => { if (!goruldu.has(u.id)) { goruldu.add(u.id); liste.push(u); } }));
    let ortak = '';
    if (sec.length === 2) {
      const a = new Set((uy[sec[0]] || []).map(u => u.varlik));
      const o = Array.from(new Set((uy[sec[1]] || []).map(u => u.varlik).filter(v => a.has(v))));
      const ta = D.mitre[sec[0]].taktik, tb = D.mitre[sec[1]].taktik;
      const ikili = sec.join(tt(' ve '));
      ortak = `<div class="verdict dusuk" style="margin-top:20px">${o.length ? `<b>${ikili}</b> ${tt('için ortak varlıklar:')} ${o.map(esc).join(', ')}. ${ta !== tb ? tt('İki teknik farklı aşamalarda ({0}, {1}); aynı varlıkta ardışık aşamalar görülüyor.', esc(ta), esc(tb)) : tt('Her iki teknik de aynı aşamada.')}` : `<b>${ikili}</b> ${tt('için ortak varlık yok.')}`}</div>`;
    }
    alt = `<h3 class="sec">${sec.map(k => k + ' ' + esc(D.mitre[k].ad)).join(' · ')}</h3>${ortak}
    <div class="tw" style="margin-top:14px"><table class="t"><thead><tr><th>${tt('Varlık')}</th><th>${tt('Uyarı türü')}</th><th>${tt('Ne oldu')}</th><th>${tt('Kaynak')}</th><th>${tt('Gün')}</th><th>${tt('İnceleme')}</th></tr></thead><tbody>${liste.map(u => `<tr class="lnk" data-a="ac-inc" data-p="${u.inc}"><td>${esc(u.varlik)}</td><td>${esc(u.tur)}</td><td style="min-width:240px">${esc(u.ne)}</td><td>${esc(KAYNAK_AD(u.kaynak))}</td><td class="nw">${gunEt(u.gun)}</td><td class="nw">${oncBadge(INC[u.inc].oncelik)}</td></tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:26px">${tt('Seçili teknikte bu dönemde uyarı yok')}</td></tr>`}</tbody></table></div>`;
  }
  return `<div class="top"><div><h1>MITRE ATT&amp;CK</h1><p class="sub">${tt('İzlenen teknikler ve bu dönemde uyarı üretenler')}</p></div></div>
  <div class="kpis3"><div class="kp"><b>${teknikSay}</b><span>${tt('izlenen teknik')}</span></div><div class="kp"><b>${uyarili}</b><span>${tt('teknikte uyarı var')}</span></div><div class="kp"><b>${uyarisayisi}</b><span>${tt('teknik etiketli uyarı')}</span></div><div class="kp"><b>${D.taktik_sirasi.length}</b><span>${tt('aşama')}</span></div></div>
  <div class="mgrid">${cols}</div>${alt || `<p class="note" style="margin-top:8px">${tt('Bir tekniğe tıklayın: o tekniğe düşen uyarılar altta listelenir. İki teknik seçerseniz ortak varlıkları görürsünüz.')}</p>`}`;
}

/* ---------------------------------------------------------------- ag gecisleri */
function viewAg(){
  const K = D.ag.kenarlar;
  const DIS_KAYNAK = D.ag.dis_kaynak;
  const toplam = k => K.reduce((a, e) => a + e[k], 0);
  const disUlasan = K.filter(e => DIS_KAYNAK.indexOf(e.kaynak) >= 0).reduce((a, e) => a + e.ulasan, 0);
  const kpi = `<div class="kpis3"><div class="kp"><b>${sayi(disUlasan)}</b><span>${tt('Dışarıdan kuruma ulaşan istek')}</span></div><div class="kp"><b>${sayi(toplam('reddedilen'))}</b><span>${tt('Reddedilen istek')}</span></div><div class="kp"><b>${D.ag.kumeler.length}</b><span>${tt('Ağ bölgesi')}</span></div><div class="kp"><b>${K.length}</b><span>${tt('Bölge çifti')}</span></div></div>`;
  const seg = `<div class="seg" style="margin-top:26px"><button class="${S.agTab === 'akis' ? 'on' : ''}" data-a="agtab" data-p="akis">${tt('Akış')}</button><button class="${S.agTab === 'matris' ? 'on' : ''}" data-a="agtab" data-p="matris">${tt('Matris')}</button></div>`;
  let govde;
  if (S.agTab === 'akis') {
    const gr = ['kuzey-güney', 'doğu-batı'].map(y => {
      const l = K.filter(e => e.yon === y).sort((a, b) => b.ulasan - a.ulasan);
      const ad = y === 'kuzey-güney' ? tt('Kurum sınırını geçen (kuzey-güney)') : tt('Kurum içi geçişler (doğu-batı)');
      const ust = `<tr class="gh"><td colspan="3">${ad} · ${tt('{0} bölge çifti', l.length)}</td><td class="n">${sayi(l.reduce((a, e) => a + e.ulasan, 0))}</td><td class="n">${sayi(l.reduce((a, e) => a + e.reddedilen, 0))}</td></tr>`;
      return ust + l.map(e => `<tr><td>${esc(e.kaynak)}</td><td>${esc(e.hedef)}</td><td style="color:var(--ink-2)">${esc(e.cihaz)}</td><td class="n">${sayi(e.ulasan)}</td><td class="n">${sayi(e.reddedilen)}</td></tr>`).join('');
    }).join('');
    govde = `<div class="tw" style="margin-top:18px"><table class="t"><thead><tr><th>${tt('Nereden')}</th><th>${tt('Nereye')}</th><th>${tt('Kaydeden cihaz')}</th><th class="n">${tt('Ulaşan')}</th><th class="n">${tt('Reddedilen')}</th></tr></thead><tbody>${gr}</tbody></table></div>`;
  } else {
    const kn = D.ag.kumeler;
    const anah = S.agMod;
    const mx = Math.max.apply(null, K.map(e => e[anah]));
    const renk = v => { if (!v) return ''; const r = Math.log10(v + 1) / Math.log10(mx + 1); const a = .12 + r * .88; return anah === 'ulasan' ? `background:rgba(21,136,103,${a.toFixed(2)});color:${a > .55 ? '#fff' : '#0b5a43'}` : `background:rgba(226,114,95,${a.toFixed(2)});color:${a > .55 ? '#fff' : '#7a2d1f'}`; };
    const satirKumeleri = kn.filter(k => K.some(e => e.kaynak === k));
    const sutunKumeleri = kn.filter(k => K.some(e => e.hedef === k));
    const bas = sutunKumeleri.map(k => `<th>${esc(k)}</th>`).join('');
    const govdeM = satirKumeleri.map(s => {
      const hucreler = sutunKumeleri.map(h => { const e = K.find(x => x.kaynak === s && x.hedef === h); return e && e[anah] ? `<td style="${renk(e[anah])}" title="${esc(s)} → ${esc(h)}: ${sayi(e[anah])}">${kisa(e[anah])}</td>` : '<td class="z">-</td>'; }).join('');
      const tp = K.filter(x => x.kaynak === s).reduce((a, x) => a + x[anah], 0);
      return `<tr><th class="rh">${esc(s)}</th>${hucreler}<td style="background:var(--soft);color:var(--ink);font-weight:700">${kisa(tp)}</td></tr>`;
    }).join('');
    govde = `<div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="mtl">${tt('Satır kaynak bölge, sütun hedef bölge. Renk logaritmik ölçekte.')}</span><div class="seg"><button class="${anah === 'ulasan' ? 'on' : ''}" data-a="agmod" data-p="ulasan">${tt('Ulaşan')}</button><button class="${anah === 'reddedilen' ? 'on' : ''}" data-a="agmod" data-p="reddedilen">${tt('Reddedilen')}</button></div></div>
    <div class="tw" style="margin-top:14px;padding:10px"><table class="heat"><thead><tr><th></th>${bas}<th>${tt('Toplam')}</th></tr></thead><tbody>${govdeM}</tbody></table></div>

function kisa(n){
  const o = DIL === 'en' ? ['.', ' B', ' M', ' K'] : [',', ' Mr', ' Mn', ' B'];
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace('.', o[0]) + o[1];
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.', o[0]) + o[2];
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace('.', o[0]) + o[3];
  return String(n);
}

function serbest(text){
  const q = norm(text).trim();
  if (!q) return;
  kullaniciMsg(text);
  if (S.incId) {
    const inc = INC[S.incId];
    let en = null, sk = 0;
    SORULAR.forEach(s => { const p = s.k.reduce((a, k) => a + (q.indexOf(norm(k)) >= 0 ? 1 : 0), 0); if (p > sk) { sk = p; en = s; } });
    if (en) { window.__sonCevap = en.id; return botMsg(en.f(inc), {dayanak:en.d(inc), chips:(en.a || []).map(a => ({et:a[0], a:a[1], p:true}))}); }
  }
  const bulunan = D.incelemeler.filter(i => norm(i.baslik + ' ' + i.varliklar.map(v => v.ad + ' ' + v.alt).join(' ')).indexOf(q) >= 0 || q.split(' ').some(w => w.length > 3 && norm(i.baslik + ' ' + i.varliklar.map(v => v.ad).join(' ')).split(' ').indexOf(w) >= 0));
  window.__sonCevap = bulunan.length ? 'arama' : 'yok';
  if (bulunan.length) return botMsg(`<p>${tt('{0} inceleme buldum:', bulunan.length)}</p><div class="mini">${bulunan.slice(0, 3).map(i => `<button data-a="mini" data-p="${i.id}" class="${i.oncelik}"><b>${esc(i.baslik)}</b><span class="r">${tt('{0} uyarı', i.uyarilar.length)}</span><small>${esc(i.kart_ozet)}</small></button>`).join('')}</div>`, {dayanak:tt('İnceleme ve varlık adlarında arandı')});
  botMsg(`<p>${tt('Bu soruya cevap verecek bir alan kayıtlarda yok.')}${S.incId ? ' ' + tt('Şu sorular bu incelemenin kayıtlarından cevaplanabilir:') : ' ' + tt('Bir incelemeyi ya da varlık adını yazabilirsiniz.')}</p>`, {chips:S.incId ? SORULAR.slice(0, 5).map(s => ({et:s.et, a:'soru:' + s.id})) : [{et:tt('Bugün ne var?'), a:'genel:' + tt('Bugün ne var?')}]});
}
function chipEylem(a){

  if (S.drawer) cekmece();
}

/* ---------------------------------------------------------------- olaylar */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  const acikMenu = $$('.sort.acik, .donem.acik');
  if (acikMenu.length && !e.target.closest('.sort, .donem')) acikMenu.forEach(m => m.classList.remove('acik'));
  if (!el) return;
  const a = el.dataset.a, p = el.dataset.p;
  switch (a) {
    case 'nav': git(p); if (window.innerWidth <= 1040) $('#chat').classList.remove('acik'); break;
    case 'geri': geri(); break;
    case 'risk': S.risk = p; render(true); break;
    case 'sirala': S.sirala = p; render(true); break;
    case 'donem': S.donem = p; render(true); break;
    case 'donem-menu': $('#donem').classList.toggle('acik'); break;
    case 'sort-menu': $('#sort').classList.toggle('acik'); break;
    case 'satir-ac': e.stopPropagation(); if (S.acik.has(p)) S.acik.delete(p); else S.acik.add(p); { const r = el.closest('.row'); r.classList.toggle('acik'); el.setAttribute('aria-expanded', r.classList.contains('acik')); } break;
    case 'ac-inc': git('inc/' + p); break;
    case 'tab': git('inc/' + S.incId + '/' + p); break;
    case 'sabit': if (S.sabit.has(p)) S.sabit.delete(p); else S.sabit.add(p); kaydetSabit(); render(true); toast(S.sabit.has(p) ? tt('İnceleme sabitlendi') : tt('Sabitleme kaldırıldı')); break;
    case 'adim': { const [i, n] = p.split('|'); S.adim[i + n] = !S.adim[i + n]; render(true); break; }
    case 'gkisi': { const [i, k] = p.split('|'); S.gkisi[i] = k; S.gdugum = null; render(true); break; }
    case 'dugum': S.gdugum = S.gdugum === p ? null : p; render(true); break;
    case 'mtsec': if (S.mtSec.has(p)) S.mtSec.delete(p); else { if (S.mtSec.size >= 2) S.mtSec.delete(Array.from(S.mtSec)[0]); S.mtSec.add(p); } render(true); break;
    case 'agtab': S.agTab = p; render(true); break;
    case 'agmod': S.agMod = p; render(true); break;
    case 'kisisec': git('kisi/' + p); break;
    case 'cekmece': S.drawer = S.drawer === p ? null : p; S.drAra = ''; cekmece(); break;
    case 'cekmece-kapat': S.drawer = null; cekmece(); break;
    case 'dil': if (p !== DIL) { try { localStorage.setItem('dsec_dil', p); } catch (e) {} location.href = (p === 'en' ? 'en/index.html' : '../index.html') + location.hash; } break;
    case 'chat-ac': $('#chat').classList.toggle('acik'); break;
    case 'brifing': kullaniciMsg(tt('Günlük özet')); brifing(); break;
    case 'soru': cevapla(p); break;
    case 'genel-soru': genelSoru(p); break;
    case 'chip': chipEylem(p); break;
    case 'mini': git('inc/' + p); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'uyonc') { S.uyOnc = el.value; render(true); }
  if (el.dataset.a === 'uykay') { S.uyKay = el.value; render(true); }
  if (el.dataset.a === 'uysira') { S.uySira = el.value; render(true); }
  if (e.target.id === 'kisiara') { const v = e.target.value.trim().toLowerCase(); const b = Object.keys(D.haftalar).find(a => a === v); if (b) git('kisi/' + b); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'uyara') { S.uyAra = e.target.value; const c = $('#card'); const y = c.scrollTop; render(true); const i = $('#uyara'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); c.scrollTop = y; }
  if (e.target.id === 'drara') { S.drAra = e.target.value; cekmece(); const i = $('#drara'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (e.target.id === 'kisiara') { const v = e.target.value.trim().toLowerCase(); if (D.haftalar[v]) git('kisi/' + v); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-a="ac-inc"][role="link"], .gnode, .step i')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
  if (e.key === 'Escape') { if (S.drawer) { S.drawer = null; cekmece(); } $$('.sort.acik, .donem.acik').forEach(m => m.classList.remove('acik')); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'ask') { e.preventDefault(); const i = $('#askin'); const v = i.value; i.value = ''; serbest(v); }
});
window.addEventListener('hashchange', () => render(false));

/* panel boyutlandirma */
(function(){
  let s = null;
  document.addEventListener('mousedown', e => { if (e.target.closest('#handle')) { s = {x:e.clientX, w:$('#chat').offsetWidth}; document.body.style.userSelect = 'none'; e.preventDefault(); } });
  document.addEventListener('mousemove', e => { if (!s) return; const w = Math.max(300, Math.min(620, s.w + e.clientX - s.x)); document.documentElement.style.setProperty('--panel', w + 'px'); });
  document.addEventListener('mouseup', () => { s = null; document.body.style.userSelect = ''; });
})();

iskelet();
render(false);
})();

</script>
</body>
